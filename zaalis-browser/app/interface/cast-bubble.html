<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Caster</title>
<link rel="stylesheet" href="zx.css">
<link rel="stylesheet" href="bubble.css">
<style>
  .dev { display: flex; align-items: center; gap: 12px; padding: 9px 16px; cursor: pointer; }
  .dev:hover { background: var(--row-h); }
  .dev .grow { flex: 1; min-width: 0; }
  .dev .n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dev .m { color: var(--muted); font-size: 12px; }
  .ctl { display: flex; gap: 6px; justify-content: center; padding: 6px 0 2px; }
  .note { padding: 8px 16px 12px; color: var(--muted); font-size: 11.5px; border-top: 1px solid var(--border); }
</style>
<script src="bubble.js"></script>
</head>
<body>
<div class="bubble">
  <div class="b-head">
    <div class="t">Caster</div>
    <button class="zx-icon-btn" id="scan" title="Rechercher des appareils"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
    <button class="zx-icon-btn" id="close" title="Fermer"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="b-body" style="padding:0 0 8px">
    <div id="media" class="b-status" style="padding:0 16px 6px"></div>
    <div id="session"></div>
    <div id="list"></div>
  </div>
  <div class="note">Envoie la vidéo ou la musique de la page au téléviseur (Chromecast, DLNA/UPnP). La recopie d'un onglet ou de l'écran n'est pas prise en charge, ni les flux protégés (Netflix, YouTube…).</div>
</div>
<script src="zx.js"></script>
<script src="cast-bubble.js"></script>
</body>
</html>
