<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>zaalis IDE film</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
:root{--paper:#F3EFE6;--ink:#16151A;--mut:#77726A;--ind:#5B57F0;--ind2:#3D39C4;--ind3:#8F8CF7;--lil:#DAD7FC;--mint:#C3E8D1;--but:#F8E3A4;--cor:#F5BBA6;--ui0:#0f0f12;--ui1:#18181b;--ui2:#27272a;--uit:#fafafa;--uim:#a1a1aa;--uit2:#d4d4d8;--uib:#1e1e21;--uibub:#1f1f23;--term:#111114;--termt:#d4d4d8;--ok:#4ade80;--chk:#22c55e;--acc:#6366f1;--car:#818cf8;}
html[data-theme=light]{--ui0:#ffffff;--ui1:#f7f7f9;--ui2:#d8d8de;--uit:#18181b;--uim:#6b6b74;--uit2:#3f3f46;--uib:#e6e6ea;--uibub:#eeeef1;--term:#f7f7f9;--termt:#3f3f46;--ok:#15803d;--chk:#16a34a;--acc:#5b5fe0;--car:#5b5fe0;}
html[data-theme=light] .inp{background:#fff}html[data-theme=light] .ubub{background:#eeeef1}html[data-theme=light] .answer{background:#fff}
html[data-theme=light] .term{border:2px solid #d8d8de}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
#stage{position:absolute;inset:0;overflow:hidden;font-family:'Inter Tight',sans-serif;color:var(--ink)}
#paper{position:absolute;inset:0;background-size:1920px 1080px}
.scene{position:absolute;inset:0;display:none;transform-origin:50% 50%}
.p{position:absolute;left:960px;top:540px;transform-origin:50% 50%}
.w{display:inline-block;transform-origin:50% 80%}
.h1{font-weight:600;font-size:116px;letter-spacing:-.045em;line-height:1.02;white-space:nowrap}
.serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:-.015em;color:var(--ind)}
.cut{background:#fff;box-shadow:0 1.5px 0 rgba(30,20,0,.08),0 3px 0 -1px rgba(30,20,0,.05),0 14px 22px -12px rgba(60,40,10,.45),0 30px 60px -34px rgba(60,40,10,.35)}
.card{border-radius:22px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.06),0 16px 26px -12px rgba(50,35,10,.45),0 50px 90px -40px rgba(50,35,10,.5)}
.card img{display:block;width:100%;height:100%}
.grain::after{content:'';position:absolute;inset:0;background:url(assets/grain1.png);background-size:520px;mix-blend-mode:multiply;opacity:.09;pointer-events:none;border-radius:inherit}
.tag{font-weight:600;font-size:34px;letter-spacing:-.02em;padding:14px 26px;border-radius:12px;white-space:nowrap}
.ui{font-family:Inter,sans-serif;color:var(--uit)}
.mono{font-family:'JetBrains Mono',monospace}
#film-grain{position:absolute;inset:-20px;background:url(assets/grain2.png);background-size:960px 540px;mix-blend-mode:multiply;opacity:.05;pointer-events:none}
#flicker{position:absolute;inset:0;background:#2a1d00;pointer-events:none;opacity:0}
.wipe{position:absolute;left:960px;top:540px;width:2600px;height:1500px;background:var(--ind);transform-origin:50% 50%}
.wipe::after{content:'';position:absolute;inset:0;background:url(assets/grain0.png);background-size:520px;mix-blend-mode:multiply;opacity:.18}
/* scene 2 input */
.inp{width:1180px;border-radius:30px;background:var(--ui1);border:2px solid var(--acc);padding:36px 40px 26px;box-sizing:border-box}
.inp .txt{font-size:42px;font-weight:500;line-height:1.3;min-height:110px;letter-spacing:-.01em}
.caret{display:inline-block;width:4px;height:46px;background:var(--car);vertical-align:-8px;margin-left:3px}
.row{display:flex;align-items:center;gap:16px;margin-top:22px}
.ib{width:64px;height:64px;border-radius:18px;border:2px solid var(--ui2);display:flex;align-items:center;justify-content:center;color:var(--uim);box-sizing:border-box}
.pill{height:64px;border-radius:32px;border:2px solid var(--ui2);display:flex;align-items:center;gap:12px;padding:0 24px;color:var(--uim);font-size:26px;font-weight:500;box-sizing:border-box}
.auto{color:#f97316;border-color:rgba(249,115,22,.55);background:rgba(249,115,22,.08)}
.send{width:76px;height:76px;border-radius:20px;background:var(--acc);display:flex;align-items:center;justify-content:center;margin-left:auto}
/* scene 3 activity */
.act{width:860px;height:760px;border-radius:28px;background:var(--ui0);border:2px solid var(--ui2);padding:34px 38px;box-sizing:border-box}
.ubub{margin-left:auto;width:max-content;max-width:640px;background:var(--ui1);border:1.5px solid var(--ui2);border-radius:18px;padding:16px 22px;font-size:24px;line-height:1.35;color:var(--uit)}
.lab{font-size:15px;font-weight:600;letter-spacing:.08em;color:var(--uim);text-align:right;margin:0 4px 8px}
.ahead{display:flex;align-items:center;gap:14px;font-size:24px;color:var(--uim);margin:26px 0 14px}
.ahead b{color:var(--uit);font-weight:500}
.arow{display:flex;align-items:center;gap:16px;font-size:23px;color:var(--uit2);padding:9px 0 9px 18px;border-left:2px solid var(--uib);margin-left:12px}
.arow .ic{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center}
.arow .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .nm em{font-style:normal;color:var(--uim)}
.badge{font-family:'JetBrains Mono',monospace;font-size:17px;color:var(--uim);border:1.5px solid var(--ui2);border-radius:8px;padding:3px 9px}
.plus{color:var(--chk);font-family:'JetBrains Mono';font-size:20px}.minus{color:#ef4444;font-family:'JetBrains Mono';font-size:20px}
.answer{margin-top:20px;background:var(--ui1);border:1.5px solid var(--ui2);border-radius:18px;padding:18px 24px;font-size:23px;line-height:1.45;color:var(--uit)}
.answer .who{font-size:15px;font-weight:700;letter-spacing:.09em;color:var(--uim);margin-bottom:6px}
.diff{width:780px;border-radius:18px;padding:24px 26px;box-sizing:border-box;font-size:19.5px;line-height:1.6}
.diff .fn{font-family:Inter;font-weight:600;font-size:22px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.diff .d{white-space:pre;padding:0 10px;border-radius:5px}
.diff .del{background:#fde3e1;color:#9b2c25}.diff .add{background:#dcf5e3;color:#1c6b37}
.term{width:810px;border-radius:18px;background:var(--term);padding:24px 28px;box-sizing:border-box;font-size:18.5px;line-height:1.65;color:var(--termt)}
.term .ok{color:var(--ok)}
.stamp{width:300px;height:300px;border-radius:50%;background:var(--mint);display:flex;flex-direction:column;align-items:center;justify-content:center;border:6px solid #1f7a45;box-sizing:border-box;color:#145c33}
.stamp .big{font-weight:700;font-size:96px;letter-spacing:-.05em;line-height:.9}
.stamp .sm{font-weight:700;font-size:26px;letter-spacing:.14em;margin-top:8px}
.bit{width:22px;height:22px;border-radius:4px}
/* chips */
.chip{display:flex;align-items:center;gap:16px;padding:18px 30px;border-radius:999px;font-weight:600;font-size:36px;letter-spacing:-.02em;white-space:nowrap}
.chip i{width:18px;height:18px;border-radius:50%;display:block}
/* toggle */
.tog{width:480px;height:104px;border-radius:52px;position:relative;box-sizing:border-box}
.tog .k{position:absolute;top:10px;left:10px;width:226px;height:84px;border-radius:42px;background:var(--ind)}
.tog .l{position:absolute;top:0;height:104px;width:240px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:34px;letter-spacing:-.02em}
/* tiles */
.tile{width:450px;height:262px;border-radius:26px;padding:34px 36px;box-sizing:border-box;display:flex;flex-direction:column}
.tile svg,.tile img{width:62px;height:62px}.tile .logos{display:flex;gap:16px;align-items:center}
.tile .t{font-weight:600;font-size:40px;letter-spacing:-.03em;margin-top:auto}
.tile .s{font-size:25px;color:#4f4b45;margin-top:6px;font-weight:500}
/* phone */
.phone{width:410px;height:820px;border-radius:64px;background:#141416;padding:16px;box-sizing:border-box}
.scr{width:100%;height:100%;border-radius:50px;background:var(--ui0);overflow:hidden;position:relative;font-family:Inter;color:var(--uit)}
.scr .top{display:flex;align-items:center;gap:10px;padding:54px 28px 18px;font-weight:600;font-size:22px;border-bottom:1.5px solid var(--uib)}
.scr .m{margin:18px 22px 0;padding:14px 18px;border-radius:16px;font-size:20px;line-height:1.4}
.qr{width:270px;padding:26px 26px 18px;border-radius:20px;box-sizing:border-box;text-align:center}
.qr img{width:218px;height:218px;display:block}
.qr div{font-weight:600;font-size:24px;margin-top:12px;letter-spacing:-.01em}
.gone{display:none!important}
</style></head>
<body><div id="stage"><div id="paper"></div><div id="root"></div><div id="film-grain"></div><div id="flicker"></div></div>
<script>
const THEME = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark';
document.documentElement.dataset.theme = THEME;
const P = 12; // poses per second (stop motion "on twos" at 24 fps)
const q = t => Math.floor(t * P + 1e-6) / P;
function hh(n){n=(n^61)^(n>>>16);n=n+(n<<3);n=n^(n>>>4);n=Math.imul(n,0x27d4eb2d);n=n^(n>>>15);return (n>>>0)/4294967296}
function jit(id,t,a=1){return{x:0,y:0,r:0};const n=Math.floor(t*P+1e-6);return{x:(hh(id*977+n*131)-.5)*1.7*a,y:(hh(id*577+n*313+7)-.5)*1.7*a,r:(hh(id*331+n*919+3)-.5)*.55*a}}
const E={lin:x=>x,out:x=>1-Math.pow(1-x,3),in:x=>x*x*x,inOut:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,back:x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},sine:x=>-(Math.cos(Math.PI*x)-1)/2};
const D={x:0,y:0,r:0,s:1,sx:1,sy:1,o:1};
function kf(t,keys){
  const full=[];let prev={...D};
  for(const k of keys){prev={...prev,...k[1]};full.push([k[0],prev,k[2]])}
  if(t<=full[0][0])return{...full[0][1]};
  for(let i=1;i<full.length;i++){if(t<=full[i][0]){const[t0,a]=full[i-1],[t1,b,e]=full[i];const u=(E[e||'inOut'])((t-t0)/Math.max(1e-6,t1-t0));const o={};for(const k in b)o[k]=a[k]+(b[k]-a[k])*u;return o}}
  return{...full[full.length-1][1]};
}
function put(el,st,id,t,opt={}){const d={...D,...st};const j=opt.nj?{x:0,y:0,r:0}:jit(id,t,opt.j??1);
  el.style.transform=`${opt.flow?'':'translate(-50%,-50%) '}translate(${(d.x+j.x).toFixed(2)}px,${(d.y+j.y).toFixed(2)}px) rotate(${(d.r+j.r).toFixed(3)}deg) scale(${(d.s*d.sx).toFixed(4)},${(d.s*d.sy).toFixed(4)})`;
  el.style.opacity=Math.max(0,Math.min(1,d.o)).toFixed(3);}
function mk(parent,cls,html='',css=''){const e=document.createElement('div');e.className=cls;if(html)e.innerHTML=html;if(css)e.style.cssText=css;parent.appendChild(e);return e}
const root=document.getElementById('root');
const scenes=[];
function scene(a,b,build,render){const el=mk(root,'scene');const ctx=build(el);scenes.push({a,b,el,ctx,render});}
// generic entry/hold/exit for a piece positioned at (x,y,r)
function life(t,{x=0,y=0,r=0,s=1},inAt,outAt,inFrom={},outTo={},ein='back'){
  const keys=[[inAt,{x,y,r,s,o:0,...inFrom}],[inAt+1/P,{o:1},'lin'],[inAt+3/P,{x,y,r,s,o:1},ein]];
  if(outAt!=null){keys.push([outAt,{x,y,r,s,o:1}]);keys.push([outAt+3/P,{x,y,r,s,...outTo},'in'])}
  return kf(t,keys);
}
// stamp-like word landing
function word(t,s,e,base={}){const k=[[s,{y:-80,s:1.4,o:0,r:-5}],[s+1/P,{y:10,s:.95,o:1,r:1.2},'lin'],[s+2/P,{y:0,s:1,o:1,r:0},'lin']];if(e!=null){k.push([e,{y:0,o:1}]);k.push([e+3/P,{y:-150,o:0,r:-7},'in'])}return kf(t,k)}
function words(container,parts){return parts.map(([txt,cls])=>{const w=document.createElement('span');w.className='w '+(cls||'');w.innerHTML=txt;container.appendChild(w);container.appendChild(document.createTextNode(' '));return w})}
const ICON={
 plus:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
 shield:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
 mic:'<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg>',
 arrow:'<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
 chev:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>',
 file:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
 check:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>',
 spin:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round"><path d="M12 3a9 9 0 0 1 9 9"/><circle cx="12" cy="12" r="9" stroke="#27272a"/></svg>',
 term:'<svg viewBox="0 0 24 24" fill="none" stroke="#16151A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6M12 19h8"/></svg>',
 globe:'<svg viewBox="0 0 24 24" fill="none" stroke="#16151A" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>',
 cursor:'<svg viewBox="0 0 24 24" fill="none" stroke="#16151A" stroke-width="2" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M10 7l5 3-2.2.6L14 13l-1 .5-1.2-2.4L10 12z" fill="#16151A"/></svg>',
 micb:'<svg viewBox="0 0 24 24" fill="none" stroke="#16151A" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg>',
 vm:'<svg viewBox="0 0 24 24" fill="none" stroke="#16151A" stroke-width="2"><rect x="2" y="3" width="20" height="7" rx="2"/><rect x="2" y="14" width="20" height="7" rx="2"/><path d="M6 6.5h.01M6 17.5h.01"/></svg>',
 bolt:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
 screen:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/><circle cx="12" cy="10" r="1.6"/></svg>',
 github:'<svg viewBox="0 0 24 24" fill="#16151A"><path d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.3c-3.3.7-4-1.4-4-1.4-.5-1.4-1.3-1.8-1.3-1.8-1.1-.8.1-.8.1-.8 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-6a4.7 4.7 0 0 1 1.2-3.2c-.1-.3-.5-1.6.1-3.3 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0C17.3 4.8 18.3 5.1 18.3 5.1c.6 1.7.2 3 .1 3.3a4.7 4.7 0 0 1 1.2 3.2c0 4.7-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.2v3.5c0 .3.2.7.8.6A12 12 0 0 0 12 .5z"/></svg>',
};
if (THEME === 'light') { ICON.check = ICON.check.replace('#22c55e', '#16a34a'); ICON.spin = ICON.spin.replace('stroke="#27272a"', 'stroke="#e4e4e8"').replace('#818cf8', '#5b5fe0'); for (const k of ['plus','mic','chev','file','screen','shield']) ICON[k] = ICON[k].replace('#a1a1aa', '#6b6b74'); }
const cube=(c)=>`<svg width="100%" height="100%" viewBox="0 0 24 24"><polygon points="${c}" stroke="#F3EFE6" stroke-width=".35" stroke-linejoin="round"/></svg>`;
const FACES=[['12 2 22 8.5 12 15 2 8.5','#9a97f8'],['2 8.5 12 15 12 22 2 15.5','#5B57F0'],['22 8.5 22 15.5 12 22 12 15','#3D39C4']];

/* ============ SCENE 1 : hook ============ */
scene(0,2.75,el=>{
  const line=mk(el,'p h1','','text-align:center');
  const ws=words(line,[['Décris'],['ce'],['que'],['tu'],['veux.','serif']]);
  const caret=mk(line,'w','','width:10px;height:96px;background:var(--ind);vertical-align:-10px;margin-left:10px;border-radius:3px');
  return{line,ws,caret};
},(c,T,t)=>{
  put(c.line,{},1,t,{nj:true});
  c.ws.forEach((w,i)=>put(w,word(t,.25+i*.25,2.25+i*.06),10+i,t,{flow:true}));
  const on=t>1.5&&t<2.3&&Math.floor(t*2.5)%2===0;c.caret.style.opacity=on?1:0;
});

/* ============ SCENE 2 : prompt ============ */
const PROMPT="Ajoute la pagination à /api/bookings, écris les tests et lance-les.";
scene(2.25,6.45,el=>{
  const inp=mk(el,'p inp ui',`<div class="txt"><span class="tx"></span><span class="caret"></span></div>
   <div class="row"><div class="ib">${ICON.plus}</div><div class="pill auto">${ICON.bolt}<b style="font-weight:600">Autonome</b>${ICON.chev}</div><div class="ib">${ICON.screen}</div><div class="pill" style="color:var(--uit2)">GPT-5.6 Luna${ICON.chev}</div><div style="margin-left:auto">${ICON.mic}</div><div class="send" style="margin-left:18px">${ICON.arrow}</div></div>`);
  const tag=mk(el,'p tag cut grain gone',`<span style="opacity:.55;margin-right:10px">▸</span>studio-app`,'background:var(--but)');
  const hint=mk(el,'p','','font-weight:500;font-size:30px;color:var(--mut);letter-spacing:-.01em');
  hint.textContent='zaalis IDE · Chat';
  return{inp,tag,hint,tx:inp.querySelector('.tx'),send:inp.querySelector('.send'),caret:inp.querySelector('.caret')};
},(c,T,t)=>{
  put(c.inp,kf(t,[[2.4,{y:760,r:6,o:1}],[2.5,{y:420,r:4}, 'lin'],[2.75,{y:0,r:-1},'out'],[2.85,{y:-12,r:.5},'lin'],[2.95,{y:0,r:0},'lin'],[5.75,{y:0,s:1,r:0}],[5.85,{y:20,s:.97,sy:.95},'lin'],[5.95,{y:-30,s:1.01},'lin'],[6.35,{y:-900,r:-4,s:.9},'in']]),20,t);
  put(c.tag,life(t,{x:-470,y:-150,r:-6},3.05,5.8,{s:1.8,r:-14},{y:-1000,r:-20}),21,t);
  put(c.hint,life(t,{x:0,y:205,r:0},3.25,5.8,{y:260},{o:0}),22,t);
  const n=Math.max(0,Math.min(PROMPT.length,Math.floor((t-3.0)*P*2.7)));
  c.tx.textContent=PROMPT.slice(0,n);
  c.caret.style.opacity=(n<PROMPT.length||Math.floor(t*2.5)%2===0)?1:0;
  const pressed=t>=5.4&&t<5.55;c.send.style.transform=pressed?'scale(.82)':'scale(1)';c.send.style.background=pressed?'#4338ca':'';
});

/* ============ SCENE 3 : agent at work ============ */
const STEPS=[
 ['7 entrées listées','','list',''],
 ['glob','**/*','glob',''],
 ['Lecture ×5','bookings.js, db.js, bookings.test.js, server.js, package.json','read',''],
 ['4 fichiers modifiés','db.js, bookings.js, server.js, bookings.test.js','apply_patch','<span class="plus">+43</span> <span class="minus">−13</span>'],
 ['1 fichier modifié','tests/bookings.test.js','apply_patch','<span class="plus">+17</span> <span class="minus">−2</span>'],
 ['run','npm test','run',''],
 ['Relecture ×2','bookings.js, bookings.test.js','read',''],
];
