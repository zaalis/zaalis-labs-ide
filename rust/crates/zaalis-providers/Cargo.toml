[package]
name = "zaalis-providers"
description = "Model provider abstraction for zaalis: one trait, four wire dialects, real streaming and native tool calling."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
zaalis-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true }
futures-util = "0.3"
async-trait = "0.1"
async-stream = "0.3"
# rustls rather than native-tls: no OpenSSL to find on Windows, and no system
# certificate store surprises inside a packaged installer.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "gzip",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
