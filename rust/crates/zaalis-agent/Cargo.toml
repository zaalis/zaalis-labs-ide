[package]
name = "zaalis-agent"
description = "Provider-neutral agent loop, DAG scheduler, budgets and interactive pauses for zaalis."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
zaalis-core = { workspace = true }
zaalis-fs = { workspace = true }
zaalis-protocol = { workspace = true }
zaalis-providers = { path = "../zaalis-providers" }
zaalis-tools = { path = "../zaalis-tools" }
zaalis-extensions = { workspace = true }
zaalis-git = { workspace = true }
zaalis-guard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
futures-util = "0.3"
async-trait = { workspace = true }

[dev-dependencies]
tempfile = "3"
async-trait = { workspace = true }
futures-util = "0.3"

[lints]
workspace = true
