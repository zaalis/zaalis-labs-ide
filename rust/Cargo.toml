[workspace]
resolver = "2"
members = [
    "crates/zaalis-core",
    "crates/zaalis-fs",
    "crates/zaalis-guard",
    "crates/zaalis-git",
    "crates/zaalis-exec",
    "crates/zaalis-checkpoint",
    "crates/zaalis-store",
    "crates/zaalis-agent",
    "crates/zaalis-agentd",
    "crates/zaalis-cli",
    "crates/zaalis-extensions",
    "crates/zaalis-providers",
    "crates/zaalis-protocol",
    "crates/zaalis-sandbox-helper",
    "crates/zaalis-tools",
]

[workspace.package]
edition = "2021"
version = "1.0.15"
license = "LicenseRef-zaalis"
authors = ["zaalis Labs"]
rust-version = "1.90"

[workspace.dependencies]
# Internal crates. Every path stays relative to this file so a crate can be
# moved without touching every dependant.
zaalis-core = { path = "crates/zaalis-core" }
zaalis-protocol = { path = "crates/zaalis-protocol" }
zaalis-fs = { path = "crates/zaalis-fs" }
zaalis-guard = { path = "crates/zaalis-guard" }
zaalis-git = { path = "crates/zaalis-git" }
zaalis-exec = { path = "crates/zaalis-exec" }
zaalis-checkpoint = { path = "crates/zaalis-checkpoint" }
zaalis-store = { path = "crates/zaalis-store" }
zaalis-agent = { path = "crates/zaalis-agent" }
zaalis-extensions = { path = "crates/zaalis-extensions" }
zaalis-providers = { path = "crates/zaalis-providers" }
zaalis-tools = { path = "crates/zaalis-tools" }

# External. Kept deliberately small: a dependency has to earn its place.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
tokio = "1"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
dunce = "1"
sha2 = "0.10"
base64 = "0.22"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Correctness-oriented lints only: the goal is catching real defects, not
# enforcing a house style the codebase then fights against.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
