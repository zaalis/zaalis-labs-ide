name: Build Linux x64

on:
  push:
    branches: [linux]
    paths-ignore:
      - 'docs/reports/linux-sync-2026-11-19.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build Linux packages
        run: sh native/build_linux.sh

      - name: Verify package and executable layout
        run: |
          bundle=native/dist-linux/resources/app/bundle
          for file in zaalis-server zaalis-agentd zaalis-sandbox bin/zaalis whisper/whisper-cli messenger-runtime/node github/gh cloudflared; do
            test -x "$bundle/$file"
          done
          "$bundle/bin/zaalis" --version
          test -x native/dist-linux/zaalis-ide
          test -x native/dist-linux/zaalis-ide-bin
          dpkg-deb --info native/installer/zaalis-linux-x64.deb
          dpkg-deb --contents native/installer/zaalis-linux-x64.deb > "$RUNNER_TEMP/zaalis-deb-files"
          grep -E '^-rwsr-xr-x root/root .* ./opt/zaalis-ide/chrome-sandbox$' "$RUNNER_TEMP/zaalis-deb-files"
          grep -E '^-rwxr-xr-x root/root .* ./opt/zaalis-ide/zaalis-ide-bin$' "$RUNNER_TEMP/zaalis-deb-files"
          tar -tzf native/installer/zaalis-linux-x64.tar.gz > "$RUNNER_TEMP/zaalis-tar-files"
          grep -Fx './resources/app/bundle/bin/zaalis' "$RUNNER_TEMP/zaalis-tar-files"
          (cd native/installer && sha256sum zaalis-linux-x64.deb zaalis-linux-x64.tar.gz > SHA256SUMS)

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: zaalis-linux-x64
          path: |
            native/installer/zaalis-linux-x64.deb
            native/installer/zaalis-linux-x64.tar.gz
            native/installer/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

      - name: Test the packaged server and its PTY
        run: node test/package-smoke.js native/dist-linux/resources/app/bundle/zaalis-server

      - name: Run application tests on Linux
        run: npm test

      - name: Start the packaged Electron desktop on X11
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v xdotool >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth xdotool
          fi
          mkdir "$RUNNER_TEMP/zaalis-portable"
          tar -xzf native/installer/zaalis-linux-x64.tar.gz -C "$RUNNER_TEMP/zaalis-portable"
          export ZAALIS_PORT=31959 ZAALIS_DATA_DIR="$RUNNER_TEMP/zaalis-desktop-smoke"
          xvfb-run -a bash -eu -o pipefail -c '
            "$RUNNER_TEMP/zaalis-portable/zaalis-ide" --disable-gpu > "$RUNNER_TEMP/zaalis-desktop.log" 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true; wait $pid 2>/dev/null || true" EXIT
            for attempt in {1..60}; do
              kill -0 "$pid" 2>/dev/null || break
              if curl -fsS "http://127.0.0.1:$ZAALIS_PORT/api/health" 2>/dev/null | grep -q desktop-launcher-v2 &&
                 xdotool search --onlyvisible --name "zaalis IDE" >/dev/null 2>&1; then
                exit 0
              fi
              sleep 1
            done
            cat "$RUNNER_TEMP/zaalis-desktop.log"
            exit 1
          '
