name: Build macOS DMGs

# Builds two .dmg installers on a real macOS runner:
#   - zaalis-macos-arm64.dmg  (Apple Silicon: M1/M2/M3...)
#   - zaalis-macos-x64.dmg    (Intel)
#
# Trigger manually from the Actions tab, or automatically on a version tag (v*).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to attach the DMGs to a release

jobs:
  build:
    runs-on: macos-14   # Cross-builds both architectures.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build macOS DMGs
        run: |
          set -o pipefail
          sh native/build_macos_dmg.sh 2>&1 | tee native/macos-build.log

      - name: Verify both DMGs
        run: python3 scripts/release/verify-macos.py

      - name: Smoke test the packaged application services
        shell: bash
        run: |
          arch=$(node -p process.arch)
          bundle="$PWD/native/dist-macos-$arch/zaalis IDE.app/Contents/Resources/app/bundle"
          export ZAALIS_TEST_SERVER_EXE="$bundle/zaalis-server"
          export ZAALIS_AGENTD_PATH="$bundle/zaalis-agentd"
          export ZAALIS_TEST_CLI_EXE="$bundle/bin/zaalis"
          node test/package-smoke.js
          node --test test/cli-parity.test.js test/conversation-runtime.test.js

      - name: Upload macOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zaalis-macos-build-log
          path: native/macos-build.log
          if-no-files-found: error

      - name: Surface macOS build failure
        if: failure()
        run: |
          details="$(grep -Ein 'error|failed|not found|cannot|unsupported|fatal' native/macos-build.log | tail -n 25 || true)"
          if [ -z "$details" ]; then details="$(tail -n 120 native/macos-build.log)"; fi
          echo "::error title=macOS DMG build failed::$(printf '%s' "$details" | tr '\n' ' ')"

      - name: Upload DMGs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zaalis-macos-dmg
          path: native/installer/*.dmg
          if-no-files-found: error

      - name: Upload DMG verification report
        uses: actions/upload-artifact@v4
        with:
          name: zaalis-macos-validation
          path: native/installer/validation-macos.json
          if-no-files-found: error

      - name: Attach DMGs to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: native/installer/*.dmg
